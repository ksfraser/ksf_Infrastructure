version: '3.8'

services:
  mariadb:
    image: docker.io/mariadb:10.11
    container_name: ksf-mariadb
    hostname: ksf-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-ksf_fa}
      MYSQL_USER: ${MARIADB_USER:-ksf_user}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ${VOLUME_PREFIX:-ksf_infrastructure}_mariadb_data:/var/lib/mysql
      - ../init-sql:/docker-entrypoint-initdb.d
    networks:
      - ksf_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontaccounting:
    image: localhost/ksf-fa:php7.4
    container_name: ksf-fa
    hostname: ksf-fa
    command: apache2-foreground
    environment:
      DB_DSN: mysql:host=ksf-mariadb;dbname=ksf_fa;charset=utf8
      DB_USER: ${MARIADB_USER:-ksf_user}
      DB_PASS: ${MARIADB_PASSWORD}
    ports:
      - "${FA_PORT:-8080}:80"
    volumes:
      - ../FA/2.4.3:/var/www/html:ro
      - ../fa_modules:/var/www/html/modules:rw
      - ../fa/ksf_fa/config_db.php:/var/www/html/config_db.php:rw
      - ../fa/ksf_fa/installed_extensions.php:/var/www/html/installed_extensions.php:rw
      - ../fa/ksf_fa/company:/var/www/html/company:rw
      - ../fa/ksf_fa/themes/default/default.css:/var/www/html/themes/default/default.css:rw
    networks:
      - ksf_network
    depends_on:
      mariadb:
        condition: service_healthy

  ksfii-app:
    image: localhost/ksf-iiapp:latest
    container_name: ksfii-app
    hostname: ksfii-app
    command: apache2ctl -D FOREGROUND
    environment:
      DB_DSN: mysql:host=ksf-mariadb;dbname=ksf_fa;charset=utf8
      DB_USER: ${MARIADB_USER:-ksf_user}
      DB_PASS: ${MARIADB_PASSWORD}
    ports:
      - "${KSFII_FA_PORT:-8090}:80"
    volumes:
      - ../FA/2.4.3:/var/www/html:ro
      - ../fa_modules:/var/www/html/modules:rw
      - ../fa/ksfii_app/config_db.php:/var/www/html/config_db.php:rw
      - ../fa/ksfii_app/installed_extensions.php:/var/www/html/installed_extensions.php:rw
      - ../fa/ksfii_app/company:/var/www/html/company:rw
      - ../fa/ksfii_app/themes/default/default.css:/var/www/html/themes/default/default.css:rw
    networks:
      - ksf_network
    depends_on:
      mariadb:
        condition: service_healthy

  wordpress:
    image: docker.io/wordpress:6.4-php8.1-apache
    container_name: ksf-wp
    hostname: ksf-wp
    ports:
      - "${WP_PORT:-8091}:80"
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-ksf_wp}
      WORDPRESS_DB_USER: ${MARIADB_USER:-ksf_user}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ${VOLUME_PREFIX:-ksf_infrastructure}_wp_data:/var/www/html
    networks:
      - ksf_network
    depends_on:
      mariadb:
        condition: service_healthy

  phpmyadmin:
    image: docker.io/phpmyadmin/phpmyadmin:latest
    container_name: ksf-pma
    hostname: ksf-pma
    ports:
      - "${PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: ksf-mariadb
      PMA_PORT: '3306'
      UPLOAD_LIMIT: 256M
    networks:
      - ksf_network
    depends_on:
      mariadb:
        condition: service_healthy

  db-sync:
    container_name: ksf-db-sync
    hostname: ksf-db-sync
    build:
      context: ../containerfiles/sync
      dockerfile: Podfile
    environment:
      LOCAL_DB_HOST: ksf-mariadb
      LOCAL_DB_PORT: '3306'
      LOCAL_DB_NAME: ${MARIADB_DATABASE:-ksf_fa}
      LOCAL_DB_USER: ${MARIADB_USER:-ksf_user}
      LOCAL_DB_PASS: ${MARIADB_PASSWORD}
      LOCAL_DB_ROOT_PASS: ${MARIADB_ROOT_PASSWORD}
      WEBHOST_DB_HOST: ${WEBHOST_DB_HOST}
      WEBHOST_DB_PORT: ${WEBHOST_DB_PORT:-3306}
      WEBHOST_DB_NAME: ${WEBHOST_DB_NAME:-ksf_fa}
      WEBHOST_DB_USER: ${WEBHOST_DB_USER}
      WEBHOST_DB_PASS: ${WEBHOST_DB_PASS}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-2000}
      SYNC_MAX_ATTEMPTS: ${SYNC_MAX_ATTEMPTS:-10}
      BACKUP_DIR: /backups
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-7}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ${VOLUME_PREFIX:-ksf_infrastructure}_backups:/backups
    networks:
      - ksf_network
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  tesseract-ocr:
    profiles: ["ocr"]
    container_name: ksf-tesseract
    hostname: ksf-tesseract
    build:
      context: ../containerfiles/tesseract
      dockerfile: Podfile
    ports:
      - "${OCR_PORT:-8100}:8100"
    networks:
      - ksf_network

  stockmarket-python-worker:
    profiles: ["stockmarket"]
    container_name: stockmarket-python-worker
    build:
      context: ../containerfiles/python
      dockerfile: Podfile
    volumes:
      - ${STOCKMARKET_PYTHON_DIR:-/home/ksf_stockmarket/ksf_stockmarket/python}:/app/python:Z
    networks:
      - ksf_network
    environment:
      WORKER_PORT: ${STOCKMARKET_WORKER_PORT:-8000}

  gpg-agent:
    profiles: ["gpg-agent"]
    container_name: ksf-gpg-agent
    hostname: ksf-gpg-agent
    image: docker.io/alpine:3.18
    ports:
      - "127.0.0.1:7890:7890"
    volumes:
      - ../fa_modules/ksf_GPG/src/Agent/GpgAgentRelay.php:/agent/GpgAgentRelay.php:ro
      - gpg-agent-log:/var/log
    networks:
      - ksf_network
    command: >
      sh -c 'apk add --no-cache gnupg php php-cli socat &&
             gpg-agent --daemon --allow-loopback-pinentry --max-cache-ttl 86400 &&
             exec php /agent/GpgAgentRelay.php'
    restart: unless-stopped

networks:
  ksf_network:
    name: ksf_network
    driver: bridge

volumes:
  ${VOLUME_PREFIX:-ksf_infrastructure}_mariadb_data:
  ${VOLUME_PREFIX:-ksf_infrastructure}_fa_data:
  ${VOLUME_PREFIX:-ksf_infrastructure}_iiapp_data:
  ${VOLUME_PREFIX:-ksf_infrastructure}_wp_data:
  ${VOLUME_PREFIX:-ksf_infrastructure}_stockmarket_python_data:
  ${VOLUME_PREFIX:-ksf_infrastructure}_backups:
  gpg-agent-log:
