---
# KSF Infrastructure Ansible Playbook
# Sets up podman pod, containers, deploys modules, and runs post-install.
#
# Usage (local dev):
#   ansible-playbook -i inventories/local ksf-playbook.yaml
#
# Usage (remote host with vault):
#   ansible-playbook -i inventories/local ksf-playbook.yaml --ask-vault-pass

- name: Setup KSF Environment
  hosts: all
  become: true

  vars:
    ksf_repo_dir: "{{ ansible_env.HOME }}/ksf_Infrastructure"
    ksf_backup_dir: "{{ ksf_repo_dir }}/backup"
    volume_prefix: "{{ volume_prefix | default('ksf_infrastructure') }}"
    fa_port: "{{ fa_port | default(8090) }}"
    wp_port: "{{ wp_port | default(8091) }}"
    pma_port: "{{ pma_port | default(8082) }}"
    ocr_port: "{{ ocr_port | default(8100) }}"
    enable_ocr_worker: "{{ enable_ocr_worker | default(false) }}"
    enable_tts_worker: "{{ enable_tts_worker | default(false) }}"
    enable_stt_worker: "{{ enable_stt_worker | default(false) }}"
    enable_gpg_agent: "{{ enable_gpg_agent | default(true) }}"

  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:

    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ ksf_backup_dir }}"
        state: directory
        mode: '0750'

  roles:
    - role: ksf.pod

    - role: ksf.firewall
      vars:
        host_firewall: firewalld
        firewall_allowed_tcp_ports:
          - { port: "{{ fa_port }}", proto: tcp }
          - { port: "{{ wp_port }}", proto: tcp }
          - { port: "{{ pma_port }}", proto: tcp }
          - { port: "{{ ocr_port }}", proto: tcp }
          - { port: "{{ tts_port | default(10200) }}", proto: tcp }
          - { port: "{{ stt_port | default(10300) }}", proto: tcp }

    - role: ksf.mariadb
      vars:
        mariadb_db: "{{ mariadb_db | default('ksf_fa') }}"
        vault_mariadb_root_pass: "{{ vault_mariadb_root_pass }}"
        vault_mariadb_user: "{{ vault_mariadb_user }}"
        vault_mariadb_pass: "{{ vault_mariadb_pass }}"

    - role: ksf.frontaccounting
      vars:
        fa_modules: "{{ fa_modules | default([]) }}"
        vault_mariadb_root_pass: "{{ vault_mariadb_root_pass }}"
        vault_mariadb_user: "{{ vault_mariadb_user }}"
        vault_mariadb_pass: "{{ vault_mariadb_pass }}"

    - role: ksf.gpg-agent
      when: enable_gpg_agent | bool

    - role: ksf.wordpress
      vars:
        vault_mariadb_user: "{{ vault_mariadb_user }}"
        vault_mariadb_pass: "{{ vault_mariadb_pass }}"

    - role: ksf.ocr
      when: enable_ocr_worker | bool

    - role: ksf.tts
      when: enable_tts_worker | bool

    - role: ksf.stt
      when: enable_stt_worker | bool

  post_tasks:
    - name: Restore database from backup
      ansible.builtin.shell: |
        if [ -f {{ ksf_backup_dir }}/ksf_fa.sql ]; then
          podman exec -i ksf-mariadb mysql -u root -p{{ vault_mariadb_root_pass }} {{ mariadb_db | default('ksf_fa') }} < {{ ksf_backup_dir }}/ksf_fa.sql 2>/dev/null
          echo "restored"
        fi
      register: db_restore
      changed_when: "'restored' in db_restore.stdout"

    - name: Backup database and config
      ansible.builtin.shell: |
        set -e
        podman exec ksf-mariadb mysqldump -u root -p{{ vault_mariadb_root_pass }} {{ mariadb_db | default('ksf_fa') }} > {{ ksf_backup_dir }}/ksf_fa.sql 2>/dev/null || true
        podman exec ksf-fa cat /var/www/html/config.php > {{ ksf_backup_dir }}/config.php 2>/dev/null || true
        podman exec ksf-fa cat /var/www/html/company/0/installed_extensions.php > {{ ksf_backup_dir }}/installed_extensions.php 2>/dev/null || true
      when: db_restore is not changed
