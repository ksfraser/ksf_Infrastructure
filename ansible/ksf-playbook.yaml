---
# KSF Infrastructure Ansible Playbook
# Sets up network, volumes, copies modules, and runs post-install
#
# Usage:
#   ansible-playbook -i inventories/local ksf-playbook.yaml
#   ansible-playbook -i inventories/production ksf-playbook.yaml

- name: Setup KSF UAT Environment
  hosts: localhost
  connection: local
  become: true

  vars:
    ksf_base_dir: /home/kevin/Documents/ksf_Infrastructure/podman
    fa_modules_dir: /home/kevin/Documents/ksf_Infrastructure/fa_modules
    ksf_backup_dir: /home/kevin/Documents/ksf_Infrastructure/backup
    mariadb_host: ksf-mariadb
    mariadb_root_pass: "{{ mariadb_root_pass | default('ksfroot2024!') }}"
    mariadb_db: "{{ mariadb_db | default('ksf_fa') }}"
    fa_port: "{{ fa_port | default(8090) }}"
    wp_port: "{{ wp_port | default(8091) }}"
    volume_prefix: "{{ volume_prefix | default('ksf_infrastructure') }}"
    fa_modules: "{{ fa_modules | default([]) }}"

  tasks:
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ ksf_backup_dir }}"
        state: directory

    - name: Create podman network
      ansible.builtin.shell: podman network create ksf_network 2>/dev/null || true

    - name: Create podman volumes with prefix
      ansible.builtin.shell: |
        podman volume create {{ volume_prefix }}_mariadb_data 2>/dev/null || true
        podman volume create {{ volume_prefix }}_fa_data 2>/dev/null || true
        podman volume create {{ volume_prefix }}_wp_data 2>/dev/null || true

    - name: Ensure FA modules directory exists
      ansible.builtin.file:
        path: "{{ fa_modules_dir }}"
        state: directory

    - name: Copy configured FA modules to modules directory
      ansible.builtin.shell: |
        cd /home/kevin/Documents
        for module in {{ fa_modules | join(' ') }}; do
          if [ -d "$module" ]; then
            cp -r "$module" "{{ fa_modules_dir }}/"
            echo "Copied $module"
          else
            echo "Skipped $module (not found)"
          fi
        done
      args:
        executable: /bin/bash

    - name: Open firewall ports for KSF
      ansible.builtin.shell: |
        firewall-cmd --permanent --add-port={{ fa_port }}/tcp 2>/dev/null || true
        firewall-cmd --permanent --add-port={{ wp_port }}/tcp 2>/dev/null || true
        firewall-cmd --reload 2>/dev/null || true
      ignore_errors: true

    - name: Start Podman Compose services
      ansible.builtin.shell: |
        cd {{ ksf_base_dir }}
        # Update compose file ports from inventory vars
        sed -i 's/"8080:80"/"{{ fa_port }}:80"/g' {{ ksf_base_dir }}/ksf-compose.yaml
        sed -i 's/"8081:80"/"{{ wp_port }}:80"/g' {{ ksf_base_dir }}/ksf-compose.yaml
        podman-compose -f {{ ksf_base_dir }}/ksf-compose.yaml up -d
      args:
        executable: /bin/bash

    - name: Update compose file for port and volume configuration
      ansible.builtin.copy:
        dest: "{{ ksf_base_dir }}/ksf-compose.yaml"
        content: |
          version: '3.8'
          
          services:
            mariadb:
              image: docker.io/mariadb:10.11
              container_name: ksf-mariadb
              hostname: ksf-mariadb
              environment:
                MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ksfroot2024!}
                MYSQL_DATABASE: ${MARIADB_DATABASE:-ksf_fa}
                MYSQL_USER: ${MARIADB_USER:-ksf_user}
                MYSQL_PASSWORD: ${MARIADB_PASSWORD:-ksfuser2024!}
              volumes:
                - {{ volume_prefix }}_mariadb_data:/var/lib/mysql
                - ../init-sql:/docker-entrypoint-initdb.d
              networks:
                - ksf_network
              healthcheck:
                test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
                interval: 10s
                timeout: 5s
                retries: 5
          
            frontaccounting:
              image: docker.io/genebarker/frontaccounting:latest
              container_name: ksf-fa
              hostname: ksf-fa
              command: --http
              ports:
                - "{{ fa_port }}:80"
              volumes:
                - {{ volume_prefix }}_fa_data:/var/www/html
                - ../fa_modules:/var/www/html/modules:z
              networks:
                - ksf_network
              depends_on:
                mariadb:
                  condition: service_healthy
          
            wordpress:
              image: docker.io/wordpress:6.4-php8.1-apache
              container_name: ksf-wp
              hostname: ksf-wp
              ports:
                - "{{ wp_port }}:80"
              environment:
                WORDPRESS_DB_HOST: mariadb
                WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-ksf_wp}
                WORDPRESS_DB_USER: ${MARIADB_USER:-ksf_user}
                WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:-ksfuser2024!}
              volumes:
                - {{ volume_prefix }}_wp_data:/var/www/html
              networks:
                - ksf_network
              depends_on:
                mariadb:
                  condition: service_healthy
          
          networks:
            ksf_network:
              name: ksf_network
              driver: bridge
          
          volumes:
            {{ volume_prefix }}_mariadb_data:
            {{ volume_prefix }}_fa_data:
            {{ volume_prefix }}_wp_data:
        mode: '0644'

    - name: Wait for MariaDB to be healthy
      ansible.builtin.pause:
        seconds: 30

    - name: Check if backup exists and restore
      when: backup_status.stat.exists
      block:
        - name: Restore MariaDB database
          ansible.builtin.shell: |
            podman exec ksf-mariadb mysql -u root -p{{ mariadb_root_pass }} {{ mariadb_db }} < {{ ksf_backup_dir }}/ksf_fa.sql 2>/dev/null || \
            (podman exec ksf-mariadb mysql -u root -p{{ mariadb_root_pass }} -e "CREATE DATABASE IF NOT EXISTS {{ mariadb_db }}" && \
             podman exec ksf-mariadb mysql -u root -p{{ mariadb_root_pass }} {{ mariadb_db }} < {{ ksf_backup_dir }}/ksf_fa.sql)
          ignore_errors: true

        - name: Restore config.php
          ansible.builtin.copy:
            src: "{{ ksf_backup_dir }}/config.php"
            dest: "{{ fa_modules_dir }}/config.php"
            mode: '0644'

        - name: Restore installed_extensions.php
          ansible.builtin.copy:
            src: "{{ ksf_backup_dir }}/installed_extensions.php"
            dest: "{{ fa_modules_dir }}/company/0/installed_extensions.php"
            mode: '0644'
      vars:
        backup_status:
          stat:
            path: "{{ ksf_backup_dir }}/ksf_fa.sql"

    - name: Run post-install script with configured ports
      ansible.builtin.shell: |
        export FA_PORT={{ fa_port }}
        export WP_PORT={{ wp_port }}
        bash {{ ksf_base_dir }}/post-install.sh
      ignore_errors: true

    - name: Backup database and config (always runs, creates new backup)
      ansible.builtin.shell: |
        set -e
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # Get container IDs
        MARIADB_CONTAINER=$(podman ps -q --filter name=ksf-mariadb | head -1)
        FA_CONTAINER=$(podman ps -q --filter name=ksf-fa | head -1)
        
        if [ -n "$MARIADB_CONTAINER" ]; then
          echo "Backing up database..."
          podman exec $MARIADB_CONTAINER mysqldump -u root -p{{ mariadb_root_pass }} {{ mariadb_db }} > {{ ksf_backup_dir }}/ksf_fa.sql
          echo "Database backed up"
        fi
        
        if [ -n "$FA_CONTAINER" ]; then
          echo "Backing up config..."
          podman exec $FA_CONTAINER cat /var/www/html/config.php > {{ ksf_backup_dir }}/config.php 2>/dev/null || true
          podman exec $FA_CONTAINER cat /var/www/html/company/0/installed_extensions.php > {{ ksf_backup_dir }}/installed_extensions.php 2>/dev/null || true
          echo "Config backed up"
        fi
        
        echo "Backup complete at {{ ksf_backup_dir }}"
      ignore_errors: true