# TLS vhost for the pod's WordPress service.
#
# Serves the same DocumentRoot as the stock 000-default vhost, but on 443 with
# the pod's private-CA certificate. The stock :80 vhost stays enabled so plain
# HTTP keeps working for browsers, wp-cli and the role's health check.

<IfModule mod_ssl.c>
	<VirtualHost *:443>
		ServerAdmin webmaster@localhost
		ServerName ksfii_app-wordpress
		ServerAlias localhost

		SSLEngine on
		SSLCertificateFile	/etc/ssl/ksf/server.crt
		SSLCertificateKeyFile /etc/ssl/ksf/server.key

		SSLProtocol -all +TLSv1.2 +TLSv1.3
		SSLCipherSuite HIGH:!aNULL:!MD5

		DocumentRoot /var/www/html
		ErrorLog ${APACHE_LOG_DIR}/error.log
		CustomLog ${APACHE_LOG_DIR}/access.log combined
	</VirtualHost>
</IfModule>
