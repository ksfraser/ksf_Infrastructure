---
# ksf.frontaccounting tasks (AGENTS-IMAGE: version tarball + per-pod overlay)
# Pod/network provisioning comes from the calling play (ksf.pod), not here.
#
# rootful/rootless: when rootful: false, all podman commands run as
# rootless_user (kevin) via become.

- name: Ensure FA image exists
  command: podman image exists "{{ fa_image }}"
  register: img_exists
  failed_when: false
  changed_when: false
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

# The image is created once and then never refreshed, so a change to the
# Podfile or the entrypoint (e.g. the FA_HTTP_PORT handling) would silently
# not apply. Compare the image's creation time with the build context.
- name: Compare the FA image age with its build context
  ansible.builtin.shell:
    cmd: |
      set -e
      created=$(podman image inspect "{{ fa_image }}" --format '{% raw %}{{.Created}}{% endraw %}' 2>/dev/null || echo 0)
      created_ts=$(date -d "$created" +%s 2>/dev/null || echo 0)
      newest=$(find "{{ fa_entrypoint_dir }}" -maxdepth 1 -type f -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
      newest_ts=$(stat -c %Y "$newest" 2>/dev/null || echo 0)
      if [ "$newest_ts" -gt "$created_ts" ]; then echo "STALE $newest"; else echo "CURRENT"; fi
  register: fa_image_age
  changed_when: false
  failed_when: false
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Decide whether the FA image must be rebuilt
  ansible.builtin.set_fact:
    fa_image_needs_build: >-
      {{ img_exists.rc != 0
         or (fa_image_rebuild | string | lower == 'auto'
             and 'STALE' in (fa_image_age.stdout | default('')))
         or (fa_image_rebuild | string | lower in ['true', 'yes', 'on', '1']) }}

- name: Build FA runtime image from Podfile
  command: >
    podman build -t "{{ fa_image }}"
    -f "{{ fa_entrypoint_dir }}/Podfile" "{{ fa_entrypoint_dir }}"
  when: fa_image_needs_build | bool
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Check source tree has FA install marker
  stat:
    path: "{{ fa_source_tree }}/index.php"
  register: fa_tree_index

- name: Unpack FA version tarball if source tree empty
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"
  unarchive:
    src: "{{ fa_source_tree }}.tgz"
    dest: "{{ fa_source_tree | dirname }}"
    remote_src: false
  when: fa_tree_index.stat is defined and not fa_tree_index.stat.exists

- name: Check config.php presence in FA tree
  stat:
    path: "{{ fa_source_tree }}/config.php"
  register: fa_config_php

- name: Ensure config.php exists in FA tree (copy from config.default.php)
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"
  copy:
    src: "{{ fa_source_tree }}/config.default.php"
    dest: "{{ fa_source_tree }}/config.php"
    remote_src: true
    mode: '0644'
  when: not fa_config_php.stat.exists

- name: Apply version-anchored items.php patch if provided
  become: true
  shell: |
    set -e
    cp "{{ fa_source_tree }}/inventory/manage/items.php" \
       "{{ fa_source_tree }}/inventory/manage/items.php.orig"
    patch -p1 --directory="{{ fa_source_tree }}" < "{{ fa_items_patch }}"
    rm -f "{{ fa_source_tree }}/inventory/manage/items.php.orig"
  when: fa_items_patch | length > 0

- name: Scaffold per-pod directory
  include_tasks: scaffold.yml

- name: Seed database (clean)
  include_tasks: seed.yml
  when: fa_seed_db is defined and fa_seed_db | bool

- name: Apply theme overlay
  include_tasks: theme.yml

- name: Run FA container
  include_tasks: container.yml
