---
# container.yml - run the FA container (AGENTS-IMAGE mount set)

- name: Check FA container exists
  command: podman container exists "{{ fa_container_name }}"
  register: fa_cont_exists
  failed_when: false
  changed_when: false

- name: Remove stale FA container
  command: podman rm -f "{{ fa_container_name }}"
  when: fa_cont_exists.rc == 0
  ignore_errors: true
  changed_when: false

- include_tasks: container-run.yml

- name: Wait for FA HTTP endpoint
  uri:
    url: "http://127.0.0.1:{{ fa_port }}/"
    method: GET
    status_code: 200,302
  register: fa_http_check
  retries: 10
  delay: 10
  until: fa_http_check.status in [200, 302]
  ignore_errors: true
  when: fa_seed_db | bool