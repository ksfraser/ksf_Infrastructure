---
# scaffold - create per-pod directory structure

- name: Create per-pod base directory
  become: true
  file:
    path: "{{ fa_pod_dir }}"
    state: directory
    mode: '0775'

- name: Create per-pod company/0 subdirectories
  become: true
  file:
    path: "{{ fa_pod_dir }}/{{ item }}"
    state: directory
    mode: '0775'
  loop:
    - company
    - company/0
    - company/0/backup
    - company/0/images
    - company/0/js_cache
    - company/0/pdf_files
    - company/0/reporting
    - themes
    - themes/default

- name: Create company index.php
  become: true
  copy:
    content: "<?php\nheader(\"Location: ../index.php\");\n"
    dest: "{{ fa_pod_dir }}/company/index.php"
    mode: '0644'

- name: Create company/0 index.php
  become: true
  copy:
    content: "<?php\nheader(\"Location: ../index.php\");\n"
    dest: "{{ fa_pod_dir }}/company/0/index.php"
    mode: '0644'

# The FA container runs Apache as www-data (uid 33 in the image). The company
# tree is bind-mounted RW and FA writes to it at runtime (js_cache, attachments,
# backup, pdf_files, images, reporting). The directories created above are
# root-owned 0775, which is NOT writable by uid 33, so FA logs
# "unlink(./company/0/js_cache/0/login.js): Permission denied" on every page
# load and silently serves stale cached JS.
#
# Files can also be left owned by an orphaned container uid (e.g. 165568 from a
# previous image) that has no passwd entry on the host; those are re-owned to
# the pod directory's owner.
- name: Ensure the company tree is writable by the container's Apache user
  become: true
  ansible.builtin.shell:
    cmd: |
      set -e
      podir_owner="$(stat -c %U:%G "{{ fa_pod_dir }}")"
      chmod -R o+rwX "{{ fa_pod_dir }}/company"
      find "{{ fa_pod_dir }}/company" \( -nouser -o -nogroup \) -exec chown "$podir_owner" {} + 2>/dev/null || true
  changed_when: false

# fa_modules is bind-mounted into BOTH pods and read by the container's Apache
# user. A module file that is not world-readable (e.g. 0600 from a dev tree
# checkout) makes FA fail to include the module's hooks.php:
#   include_once(.../modules/ksf_FA_Upc2Item/hooks.php): failed to open stream:
#   Permission denied
# which breaks the whole page, not just that module. Add the read bit where it
# is missing; never touch write bits or ownership here.
- name: Ensure deployed modules are readable by the container's Apache user
  become: true
  ansible.builtin.shell:
    cmd: |
      set -e
      find "{{ fa_modules_dir }}" -type f ! -perm -o+r -exec chmod o+r {} +
      find "{{ fa_modules_dir }}" -type d ! -perm -o+rx -exec chmod o+rx {} +
  changed_when: false

- name: Template config_db.php for this pod
  become: true
  template:
    src: config_db.php.j2
    dest: "{{ fa_pod_dir }}/config_db.php"
    mode: '0666'
    owner: root

# The extension registries are owned by FA itself (admin/inst_module.php), which
# rewrites them on every install/activate. Scaffold them ONLY when missing so a
# re-run never wipes live activation state. The ksfii_app role owns populating
# them for a fresh environment. `force: false` also keeps the inode stable when
# the file already exists, which matters because both files are bind-mounted.
- name: Template global installed_extensions.php (only if absent)
  become: true
  template:
    src: installed_extensions.php.j2
    dest: "{{ fa_pod_dir }}/installed_extensions.php"
    mode: '0666'
    owner: root
    force: false

- name: Create per-company installed_extensions.php (only if absent)
  become: true
  template:
    src: installed_extensions.php.j2
    dest: "{{ fa_pod_dir }}/company/0/installed_extensions.php"
    mode: '0666'
    owner: root
    force: false

- name: Check default theme variant exists
  stat:
    path: "{{ fa_pod_dir }}/themes/default/default.css.default"
  register: theme_default

- name: Ensure default theme CSS variant exists (copy canonical if missing)
  become: true
  copy:
    src: "{{ fa_source_tree }}/themes/default/default.css"
    dest: "{{ fa_pod_dir }}/themes/default/default.css.default"
    remote_src: true
    mode: '0644'
  when: not theme_default.stat.exists

- name: Check red theme variant exists
  stat:
    path: "{{ fa_pod_dir }}/themes/default/default.css.red"
  register: theme_red

- name: Ensure red theme variant exists
  become: true
  copy:
    src: "{{ fa_pod_dir }}/themes/default/default.css.default"
    dest: "{{ fa_pod_dir }}/themes/default/default.css.red"
    remote_src: true
    force: false
    mode: '0644'
  when: not theme_red.stat.exists

# default.css.yellow is required for `fa_theme: yellow` (the documented UAT
# look). It was previously never scaffolded, so selecting it failed on a fresh
# pod. Same pattern as .red: seeded once from the canonical variant, never
# overwritten, and the theme task only ever copies a variant ONTO the mounted
# default.css - the variants themselves stay unmounted.
- name: Check yellow theme variant exists
  stat:
    path: "{{ fa_pod_dir }}/themes/default/default.css.yellow"
  register: theme_yellow

- name: Ensure yellow theme variant exists
  become: true
  copy:
    src: "{{ fa_pod_dir }}/themes/default/default.css.default"
    dest: "{{ fa_pod_dir }}/themes/default/default.css.yellow"
    remote_src: true
    force: false
    mode: '0644'
  when: not theme_yellow.stat.exists