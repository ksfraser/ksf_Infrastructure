---
# ksf.mariadb tasks (CLI-based; no podman API socket required)
# Depeps: ksf.pod, ksf.phpmyadmin (see meta/main.yml)
#
# rootful/rootless: when rootful: false, all podman commands run as
# rootless_user (kevin) via become. XDG_RUNTIME_DIR is set accordingly.

- name: Check mariadb data volume exists
  command: podman volume exists "{{ mariadb_data_volume }}"
  register: vol_exists
  failed_when: false
  changed_when: false
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Create mariadb data volume
  command: podman volume create "{{ mariadb_data_volume }}"
  when: vol_exists.rc != 0
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Check mariadb container exists
  command: podman container exists "{{ mariadb_container_name }}"
  register: cont_exists
  failed_when: false
  changed_when: false
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Ensure mariadb image is present
  command: podman image exists "{{ mariadb_image }}"
  register: img_exists
  failed_when: false
  changed_when: false
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Pull mariadb image
  command: podman pull "{{ mariadb_image }}"
  when: img_exists.rc != 0
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Remove stale mariadb container
  command: podman rm -f "{{ mariadb_container_name }}"
  ignore_errors: true
  changed_when: false
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Run mariadb container
  command: >
    podman run -d --name "{{ mariadb_container_name }}"
    {% if use_pod | bool %}
    --pod "{{ pod_name }}"
    {% else %}
    --network "{{ pod_name }}"
    -p "{{ mariadb_host_port }}:{{ mariadb_container_port }}"
    {% endif %}
    -e MARIADB_ROOT_PASSWORD="{{ mariadb_root_pass }}"
    -e MARIADB_DATABASE="{{ mariadb_db }}"
    -e MARIADB_USER="{{ mariadb_user }}"
    -e MARIADB_PASSWORD="{{ mariadb_pass }}"
    -e MARIADB_AUTO_UPGRADE=1
    -v "{{ mariadb_data_volume }}:/var/lib/mysql"
    "{{ mariadb_image }}" {{ mariadb_extra_options }}
  register: run_result
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Wait for mariadb to accept connections
  command: >-
    podman exec "{{ mariadb_container_name }}" mysqladmin ping -h localhost
    -uroot -p"{{ mariadb_root_pass }}" --silent
  register: ping
  retries: 24
  delay: 5
  until: ping.rc == 0
  changed_when: false
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"

- name: Create additional databases + grant to ksf user
  command: >
    podman exec "{{ mariadb_container_name }}" mysql
    -uroot -p"{{ mariadb_root_pass }}" -e
    "CREATE DATABASE IF NOT EXISTS {{ item }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
     GRANT ALL PRIVILEGES ON {{ item }}.* TO '{{ mariadb_user }}'@'%'; FLUSH PRIVILEGES;"
  loop: "{{ mariadb_additional_databases }}"
  changed_when: false
  become: "{{ not rootful | bool }}"
  become_user: "{{ rootless_user if not rootful | bool else 'root' }}"
  environment:
    XDG_RUNTIME_DIR: "{{ '/run/user/' + rootless_uid | string if not rootful | bool else omit }}"
