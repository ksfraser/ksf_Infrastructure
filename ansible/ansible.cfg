# ansible.cfg - ksf_Infrastructure
#
# WHY THIS FILE IS REQUIRED
#
# The playbook entry points live in ansible/ (ksfii-app.yaml, ksf-fa.yaml) but
# the per-pod plays they import live in ansible/plays/. Ansible derives the
# default roles_path from the directory of the play file that contains the role
# reference, so it searched ansible/plays/roles/ and never found this repo's
# roles. It then fell through to the system config (/etc/ansible/ansible.cfg ->
# /root/.ansible/roles), which is a DIFFERENT repository (ksfraser/ksf_ansible).
# Net effect: `ksf.mariadb` and `ksfii_app` could not be resolved at all and the
# provisioner could not run -- which is why the live containers were created by
# hand rather than by this playbook.
#
# Order matters and is deliberate:
#   1. ./roles  -> this repo. Holds the podman/FA-overlay roles that actually
#                  build the running containers, including ksfii_app which
#                  exists nowhere else. Taking these first keeps the deployment
#                  reproducible against THIS repo.
#   2. /root/.ansible/roles -> the canonical ksf_ansible role library (~200
#                  roles: ksf.firewall, ksf.nextcloud, ksf.nginx_proxy,
#                  ksf.bind, ksf.postfix, ksf.dovecot, ...). Roles not present
#                  in ./roles fall back here.
#
# NOTE: ksf.frontaccounting, ksf.mariadb, ksf.wordpress and ksf.phpmyadmin exist
# in BOTH trees and HAVE DIVERGED. ./roles wins, so this repo's
# container-only variants are authoritative for this playbook. See
# AGENTS_APPENDIX.md ("two role trees") before editing either copy.

[defaults]
roles_path = ./roles:/root/.ansible/roles
inventory = ./inventories
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = /usr/bin/python3

[privilege_escalation]
become = True
become_method = sudo